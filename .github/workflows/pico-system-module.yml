name: PICO System Installer Module

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'APK versionCode (must be greater than PICO stock 100103003)'
        required: false
        default: '100103004'

jobs:
  build_module:
    name: Build flashable module
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Build APK and package module
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          chmod +x ./gradlew magisk/pico-system-installer/build.sh
          bash magisk/pico-system-installer/build.sh

      - name: Upload module zip
        uses: actions/upload-artifact@v7
        with:
          name: InstallerX-PICO-system-module
          path: magisk/pico-system-installer/dist/*.zip
          retention-days: 30
